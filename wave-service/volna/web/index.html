<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Volna</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23000'/%3E%3Cpath d='M5 18c3-5 5-5 8 0s5 5 8 0 4-4 6-1' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <canvas id="topo" class="topo" aria-hidden="true"></canvas>

  <div class="app">
    <header class="top">
      <span class="brand">volna</span>
      <span class="top__right">
        <span class="status" id="status" role="status"></span>
        <button class="icon-btn" id="open-settings" type="button" aria-label="Настроить волну" title="Настроить волну">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/>
            <circle cx="16" cy="7" r="2"/>
            <circle cx="10" cy="17" r="2"/>
          </svg>
        </button>
      </span>
    </header>

    <main class="stage">
      <button class="wave" id="wave" type="button" aria-label="Запустить «Мою волну»">
        <span class="wave__ring" aria-hidden="true"></span>
        <span class="wave__cover" id="cover" aria-hidden="true"></span>
        <svg class="wave__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path id="icon" d="M8 5.5v13l10.5-6.5z"/>
        </svg>
      </button>

      <div class="caption">
        <div class="caption__title" id="title">Моя волна</div>
        <div class="caption__sub" id="sub">Нажмите, и музыка пойдёт сама</div>
        <div class="caption__reason" id="reason"></div>
      </div>

      <div class="progress" id="progress" hidden>
        <div class="progress__bar" id="bar"></div>
      </div>

      <div class="controls" id="controls" hidden>
        <button class="ctl" id="dislike" type="button" aria-label="Не нравится" title="Не нравится (D)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>
            <path d="M4 4l16 16"/>
          </svg>
        </button>
        <button class="ctl" id="like" type="button" aria-label="Нравится" aria-pressed="false" title="Нравится (L)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>
          </svg>
        </button>
        <button class="ctl" id="skip" type="button" aria-label="Следующий трек" title="Дальше (→)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l9 6-9 6z"/>
            <path d="M18 6v12"/>
          </svg>
        </button>
      </div>
    </main>

    <footer class="bottom">
      <button class="tune-pill" id="tune-pill" type="button" aria-label="Настроить волну">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/>
          <circle cx="16" cy="7" r="2"/>
          <circle cx="10" cy="17" r="2"/>
        </svg>
        <span id="tune-summary">Баланс</span>
      </button>
      <div class="next" id="next"></div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <header class="sheet__head">
      <h2 id="sheet-title">Настроить волну</h2>
      <button class="icon-btn" id="close-settings" type="button" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <div class="group">
      <div class="group__label">Характер</div>
      <div class="segmented" data-setting="character">
        <button type="button" data-value="favorite">Любимое</button>
        <button type="button" data-value="balanced">Баланс</button>
        <button type="button" data-value="discover">Незнакомое</button>
        <button type="button" data-value="forgotten">Забытое</button>
      </div>
      <p class="hint" id="character-hint"></p>
    </div>

    <div class="group">
      <div class="group__label">Настроение</div>
      <div class="chips" data-setting="mood">
        <button type="button" data-value="any">Любое</button>
        <button type="button" data-value="energetic">Бодрое</button>
        <button type="button" data-value="happy">Весёлое</button>
        <button type="button" data-value="calm">Спокойное</button>
        <button type="button" data-value="sad">Грустное</button>
      </div>
    </div>

    <div class="group">
      <div class="group__label">Занятие</div>
      <div class="chips" data-setting="activity">
        <button type="button" data-value="any">Любое</button>
        <button type="button" data-value="wake">Просыпаюсь</button>
        <button type="button" data-value="commute">В дороге</button>
        <button type="button" data-value="work">Работаю</button>
        <button type="button" data-value="workout">Тренируюсь</button>
        <button type="button" data-value="sleep">Засыпаю</button>
      </div>
    </div>

    <div class="group">
      <div class="row">
        <span>Без слов</span>
        <button class="switch" type="button" role="switch" data-setting="no_vocals" aria-checked="false" aria-label="Без слов"></button>
      </div>
    </div>

    <div class="group">
      <div class="group__label">Тонкая настройка</div>

      <label class="slider">
        <span class="slider__head"><span>Смелость подбора</span><output id="temperature-value"></output></span>
        <input type="range" min="0.1" max="1.5" step="0.05" data-setting="temperature" aria-describedby="temperature-scale">
        <span class="slider__scale" id="temperature-scale"><span>предсказуемо</span><span>смело</span></span>
      </label>

      <label class="slider">
        <span class="slider__head"><span>Разнообразие</span><output id="diversity-value"></output></span>
        <input type="range" min="0" max="1" step="0.05" data-setting="diversity" aria-describedby="diversity-scale">
        <span class="slider__scale" id="diversity-scale"><span>одно звучание</span><span>всё разное</span></span>
      </label>

      <label class="slider">
        <span class="slider__head"><span>Не повторять треки</span><output id="repeat-value"></output></span>
        <input type="range" min="0" max="60" step="1" data-setting="repeat_days">
        <span class="slider__scale"><span>можно сразу</span><span>2 месяца</span></span>
      </label>

      <div class="row">
        <span>Учитывать время суток и выходные</span>
        <button class="switch" type="button" role="switch" data-setting="context_aware" aria-checked="true" aria-label="Учитывать время суток и выходные"></button>
      </div>

      <button class="link-btn" id="reset-auto" type="button">Вернуть значения характера</button>
    </div>

    <button class="wide-btn" id="shake" type="button">Встряхнуть волну</button>

    <div class="group taste" id="taste">
      <div class="group__label">Ваш вкус</div>
      <p class="hint" id="taste-signals">Загружаю…</p>
      <div class="taste__cols">
        <div>
          <div class="taste__title">Дослушиваете</div>
          <ol class="taste__list" id="taste-loved"></ol>
        </div>
        <div>
          <div class="taste__title">Чаще пропускаете</div>
          <ol class="taste__list" id="taste-skipped"></ol>
        </div>
      </div>
      <p class="hint" id="taste-sources"></p>
    </div>
  </section>

  <audio id="audio" preload="auto"></audio>
  <script src="/topo.js"></script>
  <script src="/app.js"></script>
</body>
</html>
