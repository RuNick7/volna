<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Volna</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-route="home">
  <canvas id="topo" class="topo" aria-hidden="true"></canvas>

  <div class="shell">
    <header class="top">
      <span class="brand">volna</span>
      <span class="status" id="status" role="status"></span>
    </header>
    <main class="view" id="view" tabindex="-1">
      <!-- Моя волна -->
    </main>
    <div class="mini" id="mini" hidden></div>
    <nav class="tabbar" id="tabbar" aria-label="Разделы"></nav>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></section>
  <div class="toast" id="toast" role="status" hidden></div>

  <audio id="audio" preload="auto"></audio>
  <script src="/topo.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
