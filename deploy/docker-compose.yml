# Volna на сервере рядом с navidrome-stack. Выкатка: ./deploy/deploy.sh, подробности в deploy/README.md.
name: volna

services:
  volna:
    build: ./wave-service
    image: volna/wave-service
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
      # сервис открыт в интернет через Caddy: пускаем только по аккаунту Navidrome
      VOLNA_AUTH: "1"
      # импорт плейлистов по ссылке (Spotify, Apple Music) через Explo из того же стека
      EXPLO_URL: http://explo:7288
      # пользователи ставят исполнителей на докачку дискографий (Lidarr + Soularr того же стека)
      LIDARR_URL: http://lidarr:8686
    # логин Explo (EXPLO_USER, EXPLO_PASSWORD) и ключ Lidarr (LIDARR_API_KEY) — в /opt/volna/.env рядом, не в git
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Общая сеть с Navidrome, AudioMuse и Caddy: сервис ходит к ним напрямую, Caddy — к нему по имени volna
networks:
  default:
    name: navidrome-stack_default
    external: true
