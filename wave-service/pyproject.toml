[project]
name = "volna-wave-service"
version = "0.1.0"
description = "Прототип «Моей волны» для Navidrome + AudioMuse-AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
volna = "volna.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["volna*"]

[tool.setuptools.package-data]
volna = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
